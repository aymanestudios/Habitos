<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: la app usa toda la pantalla del iPhone (incluida la zona de la barra inferior) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1B1C" media="(prefers-color-scheme: dark)" />
    <!-- Ajustes para que, instalada en iOS, se comporte como una app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Progress&amp;Go" />
    <!-- Pone el tema ANTES de pintar nada, para que no haya un destello claro al abrir en oscuro (ver src/lib/theme.ts) -->
    <script>
      try {
        var t = localStorage.getItem('pg-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>Progress&amp;Go</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
